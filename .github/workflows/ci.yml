# Workflow de Integração Contínua (CI).
# Roda em cada push/PR para garantir que main e improvements
# sempre tenham código type-safe, testado e (quando aplicável) lintado.

name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type-check, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (api + web + types)
        run: pnpm type-check

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Run tests
        run: pnpm test